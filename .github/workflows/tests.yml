name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pytest cryptography
      - run: cd bridge && python -m pytest -q tests
      - run: node --check pwa/static/app.js && node --check pwa/static/sw.js
